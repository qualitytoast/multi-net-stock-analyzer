[project]
name = "detmaso"
version = "0.1.0"
description = "Faithful MVP reproduction of Det-MASO (arXiv 2610.34936) on CSI300"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqlib==0.9.7",
    "pandas>=2.2,<3",
    "numpy>=2.0",
    "torch>=2.5",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=16",
    "pyyaml>=6",
    "matplotlib>=3.9",
    # Pulled in by pyqlib; 3.13+ breaks Qlib's recorder (qlib issue #2391).
    "mlflow<3.13",
]

[project.scripts]
detmaso = "detmaso.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detmaso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "data: tests that need the downloaded Qlib dataset (skipped if it is missing)",
]
